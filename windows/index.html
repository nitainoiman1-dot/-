  --ink:#F1EEDD; --fg:#F1EEDD; --muted:#A9BDB1;
  --deck:#0F1B17; --deck-ink:#F1EEDD; --deck-muted:#9DB5A8;
  --hero:#0F1B17; --hero-fg:#F1EEDD; --hero-soft:rgba(241,238,221,.14);
  --nav:rgba(24,40,34,.97);
  --hl:rgba(255,222,89,.22);
  --paper-line:rgba(241,238,221,.045); --paper-margin:rgba(255,120,120,.16);
  --shadow:none;
}

/* דף מחברת: שורות כחולות ושוליים אדומים */
body{
  background-color:var(--bg);
  background-image:
    linear-gradient(to left,transparent 0,transparent 30px,var(--paper-margin) 30px,var(--paper-margin) 32px,transparent 32px),
    repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--paper-line) 31px,var(--paper-line) 32px);
  background-attachment:scroll;
}

/* כותרות בכתב יד, וכותרת כרטיס בסימון מרקר */
h1,.deck h2{font-family:'Gveret Levin','Secular One','Rubik','Heebo',cursive;font-weight:400;letter-spacing:.01em}
.card h2,.box h2{
  display:inline-block;padding:0 6px;margin-inline-start:-6px;
  background:linear-gradient(transparent 58%,var(--hl) 58%,var(--hl) 90%,transparent 90%);
}

/* לוח גיר במסגרת עץ */
.deck,#app>header.top{
  border:7px solid var(--wood);border-radius:18px;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.30),inset 0 0 46px rgba(0,0,0,.28),0 5px 0 var(--wood-dark),0 14px 20px rgba(60,40,10,.22);
}
.board.deck,#app>header.top{
  background-image:
    radial-gradient(ellipse at 18% 12%,rgba(255,255,255,.07),transparent 55%),
    radial-gradient(ellipse at 85% 85%,rgba(255,255,255,.05),transparent 50%);
}
.deck .ex,.deck .mini{font-family:inherit}

/* כרטיסים כמו דפים */
.card{border-radius:14px;border:1px solid var(--line)}

/* כפתורים עם צל עיפרון */
.btn.primary{box-shadow:0 3px 0 rgba(0,0,0,.20);transition:transform .08s,box-shadow .08s}
.btn.primary:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.20)}
.chip{border-style:dashed}
.chip[aria-pressed="true"]{border-style:solid}

/* סרגל ניווט תחתון עם תפירה */
nav.tabs{border-top:2px dashed var(--line);background:var(--nav)}
.tab[aria-current="page"],nav.tabs button[aria-selected="true"]{background:linear-gradient(transparent 12%,var(--hl) 12%);color:var(--ink)}
nav.tabs button[aria-selected="true"]{border-radius:12px}

/* פריטים קטנים */
.pill{border:1px dashed var(--line)}
.coin{box-shadow:0 2px 0 rgba(0,0,0,.18)}
::selection{background:var(--hl)}
</style>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{overflow:hidden;font-family:'Heebo',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);font-size:16px;line-height:1.45;background-color:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:400}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#shell{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
/* לשוניות מחברת עם מפרידים צבעוניים */
#bar{display:flex;align-items:flex-end;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 8px) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));background:var(--surface2);border-bottom:2px solid var(--line);flex:none}
.binder{display:flex;gap:6px;flex:1;min-width:0}
.bt{flex:1;min-width:0;min-height:52px;border:1px solid var(--line);border-bottom:0;border-top:6px solid var(--tc,#888);border-radius:12px 12px 0 0;background:var(--surface);color:var(--muted);font-weight:700;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;opacity:.82;transform:translateY(2px)}
.bt[aria-selected="true"]{opacity:1;color:var(--ink);background:var(--bg);transform:translateY(2px);box-shadow:0 -3px 0 color-mix(in srgb,var(--tc) 25%,transparent)}
.bt:focus-visible,.gear:focus-visible,.btn:focus-visible,.opt:focus-visible,.act:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #E2562B;outline-offset:2px}
.gear{width:44px;height:44px;margin-bottom:6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
#stage{position:relative;flex:1;min-height:0}
.pane{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;background-color:var(--bg)}
.pane[hidden],iframe.pane[hidden]{display:none!important}
iframe.frame{width:100%;height:100%;border:0}
.page{max-width:560px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 36px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:19px;margin-bottom:10px;font-family:'Rubik','Heebo',sans-serif;font-weight:700}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:#D9480F;border-color:#D9480F;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.danger{color:#C23A4B;border-color:#C23A4B;background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.btns{display:flex;gap:10px;flex-wrap:wrap}.btns .btn{flex:1 1 130px}
/* לוח */
.board{background:var(--deck);color:var(--deck-ink);padding:18px;display:grid;gap:14px;position:relative}
.board h2{font-family:'Gveret Levin','Rubik',sans-serif;font-size:26px;line-height:1.1;margin:0;color:var(--deck-ink);background:none;padding:0;display:block}
.board p{margin:2px 0 0;color:var(--deck-muted);font-size:14px}
.btop{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.pr{position:relative;width:78px;height:78px}
.pr svg{width:100%;height:100%;transform:rotate(-90deg)}
.pr circle{fill:none;stroke-width:8}
.pr .bg{stroke:rgba(255,255,255,.18)} .pr .fg{stroke:#F2B01E;stroke-linecap:round}
.pr b{position:absolute;inset:0;display:grid;place-items:center;font-family:'Rubik',sans-serif;font-size:17px}
.bstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bstats div{background:rgba(255,255,255,.10);border-radius:12px;padding:8px 6px;text-align:center;min-width:0}
.bstats b{display:block;font-family:'Rubik',sans-serif;font-size:22px;line-height:1.1}
.bstats span{font-size:12px;color:var(--deck-muted)}
.exams{display:flex;gap:8px;flex-wrap:wrap}
.ex{border:1px dashed rgba(255,255,255,.35);background:transparent;color:var(--deck-ink);border-radius:12px;padding:6px 12px;font-size:13px;display:flex;flex-direction:column;align-items:flex-start;cursor:pointer;text-align:start}
.ex.hot{border-color:#F2B01E;background:rgba(242,176,30,.16)}
.ex b{font-size:14px}
/* אתגר */
.chal{display:flex;gap:14px;align-items:center}
.chal .badge{width:58px;height:58px;border-radius:16px;background:#F2B01E;color:#2A1C00;display:grid;place-items:center;flex:none;transform:rotate(-6deg);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.chal .badge svg{width:30px;height:30px;stroke-width:2.2}
.chal.done .badge{background:#19A974;color:#fff}
.chal b{font-size:17px;display:block}
/* פעולות מהירות */
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.act{border:1px solid var(--line);background:var(--surface);border-radius:14px;min-height:84px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:13px;cursor:pointer;text-align:center;border-top:5px solid var(--tc,#888)}
.act svg{width:26px;height:26px}
/* מילת היום */
.flip{width:100%;border:2px dashed var(--line);background:var(--surface2);border-radius:14px;padding:18px 12px;cursor:pointer;text-align:center;min-height:96px}
.flip .w{font-family:'Rubik',sans-serif;font-size:28px;font-weight:700;overflow-wrap:anywhere}
.flip .t{font-size:22px;font-weight:700;color:#19A974;margin-top:6px;overflow-wrap:anywhere}
.flip .h{font-size:13px;color:var(--muted);margin-top:4px}
.note{background:#FFF3B8;color:#3A2F00;border-radius:4px;padding:14px 16px;box-shadow:0 3px 8px rgba(60,40,0,.18);transform:rotate(-.8deg);font-family:'Gveret Levin','Heebo',cursive;font-size:20px;line-height:1.35;position:relative}
.note::before{content:"";position:absolute;top:-9px;inset-inline-start:46%;width:56px;height:18px;background:rgba(255,255,255,.55);transform:rotate(3deg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
@media (prefers-color-scheme:dark){html:not([data-theme="light"]) .note{background:#E9D98A}}
/* תעודה */
.rc{border:3px double var(--ink);border-radius:6px;background:var(--surface);padding:18px 16px;position:relative;box-shadow:var(--shadow)}
.rc h1{font-family:'Gveret Levin','Rubik',sans-serif;font-size:30px;text-align:center;line-height:1.1}
.rc .sub{text-align:center;color:var(--muted);font-size:13px;margin:2px 0 14px}
.rc h3{font-family:'Rubik',sans-serif;font-weight:700;font-size:15px;margin:16px 0 6px;border-bottom:2px solid var(--ink);padding-bottom:3px}
.gr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.gr .nm{font-weight:700;overflow-wrap:anywhere}
.gr .g{font-weight:800;text-align:end;font-size:14px;white-space:nowrap}
.gr .meter{grid-column:1/-1;height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.gr .meter i{display:block;height:100%;border-radius:99px}
.stamp{position:absolute;top:14px;inset-inline-start:12px;border:3px solid #C23A4B;color:#C23A4B;border-radius:10px;padding:2px 10px;font-weight:800;font-size:15px;transform:rotate(-12deg);opacity:.85;font-family:'Rubik',sans-serif}
.cmt{font-family:'Gveret Levin','Heebo',cursive;font-size:19px;line-height:1.4;margin:6px 0 2px}
.sig{display:flex;justify-content:space-between;gap:20px;margin-top:22px;font-size:13px;color:var(--muted)}
.sig span{flex:1;border-top:1px solid var(--muted);padding-top:4px;text-align:center}
.empty{text-align:center;color:var(--muted);padding:14px 8px}
/* חלון תחתון */
#shade{position:fixed;inset:0;background:rgba(8,12,10,.55);z-index:60}
#sheet{position:fixed;inset:auto 0 0 0;z-index:61;display:flex;justify-content:center}
#sheet[hidden]{display:none}
#sheet .panel{background:var(--bg);width:100%;max-width:560px;max-height:84vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));border:1px solid var(--line);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#sheet h2{font-size:22px;margin-bottom:12px;font-family:'Gveret Levin','Rubik',sans-serif}
textarea,input[type=text]{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
textarea{min-height:90px;resize:vertical}
#toast{position:fixed;inset-inline:0;bottom:calc(30px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;justify-content:center;pointer-events:none}
#toast[hidden]{display:none}
#toast div{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:86%;text-align:center;animation:up .2s}
/* אתגר מסך מלא */
#full{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow:auto}
#full[hidden]{display:none}
#full .in{width:100%;max-width:560px;display:flex;flex-direction:column;gap:14px;flex:1}
.prog{display:flex;gap:6px}.prog i{flex:1;height:8px;border-radius:99px;background:var(--surface2)}.prog i.on{background:#F2B01E}.prog i.ok{background:#19A974}.prog i.no{background:#C23A4B}
.qt{font-size:22px;font-weight:700;overflow-wrap:anywhere;white-space:pre-wrap;font-family:'Rubik','Heebo',sans-serif}
.opt{width:100%;text-align:start;min-height:54px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;display:flex;gap:10px;align-items:center;overflow-wrap:anywhere}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-size:13px;font-weight:800}
.opt.ok{border-color:#19A974;background:color-mix(in srgb,#19A974 18%,var(--surface))}
.opt.no{border-color:#C23A4B;background:color-mix(in srgb,#C23A4B 18%,var(--surface))}
.src{font-size:12px;font-weight:800;letter-spacing:.04em;color:var(--muted)}
.big{font-family:'Gveret Levin','Rubik',sans-serif;font-size:34px;text-align:center}
.stars{display:flex;justify-content:center;gap:8px}.stars svg{width:44px;height:44px}

#credit{flex:none;text-align:center;font-size:11px;line-height:1;padding:6px 8px;background:var(--surface2);color:var(--muted);border-top:1px solid var(--line);letter-spacing:.01em;user-select:none}
</style>

var frames={maslul:$('#f-maslul'),vocab:$('#f-vocab')};
var ready={maslul:false,vocab:false};
var seq=0,pending={};
window.addEventListener('message',function(e){
  var m=e.data; if(!m||m.__maslul!==1)return;
  if(e.source!==frames.maslul.contentWindow&&e.source!==frames.vocab.contentWindow)return;
  if(m.t==='ready'){ready[m.app]=true;return}
  if(m.t==='award'){shareAward(m.n,m.src);return}
  if(m.id&&pending[m.id]){var f=pending[m.id];delete pending[m.id];f(m)}
});
function ask(app,msg,ms){
  return new Promise(function(res){
    var id=++seq; msg.id=id; msg.__maslul=1;
    var to=setTimeout(function(){delete pending[id];res(null)},ms||2500);
    pending[id]=function(m){clearTimeout(to);res(m)};
    try{frames[app].contentWindow.postMessage(msg,'*')}catch(e){clearTimeout(to);delete pending[id];res(null)}
  });
}
function waitReady(app,ms){
  return new Promise(function(res){var t0=Date.now();(function chk(){if(ready[app])return res(true);if(Date.now()-t0>(ms||6000))return res(false);setTimeout(chk,120)})()});
}
function shareAward(n,src){
  ask('maslul',{t:'award',n:n,why:src==='vocab'?'אוצר המילים':''}).then(function(){
    toast('+'+n+' נקודות גם במסלול');refreshHead();
  });
}
function award(n,why){return ask('maslul',{t:'award',n:n,why:why})}

var VIEW='home';

  VIEW=v;
  $$('.bt').forEach(function(b){b.setAttribute('aria-selected',b.dataset.v===v?'true':'false')});
  ['home','report'].forEach(function(k){$('#v-'+k).hidden=(k!==v)});
  ['maslul','vocab'].forEach(function(k){$('#f-'+k).hidden=(k!==v)});
  if(v==='home')renderHome();
  if(v==='report')renderReport();
  if(sub&&(v==='maslul'||v==='vocab'))waitReady(v).then(function(){ask(v,{t:'tab',tab:sub})});
  lsSet('school.view',v);
}
$$('.bt').forEach(function(b){b.addEventListener('click',function(){go(b.dataset.v)})});

var DATA={sum:null,voc:null};
function loadData(){
  return Promise.all([waitReady('maslul'),waitReady('vocab')]).then(function(){return Promise.all([
    ask('maslul',{t:'summary'}),
    ask('vocab',{t:'summary'})
  ])}).then(function(r){
    DATA.sum=r[0]&&r[0].data||null;
    var voc=null;try{voc=r[1]&&r[1].raw?JSON.parse(r[1].raw):null}catch(e){}
    DATA.voc=voc&&voc.words?voc:null;
    pushWidget();
    return DATA;
  });
}

/* ---------- אתגר יומי ---------- */
var CH=null;
function buildQuestions(){
  var out=[],words=(DATA.voc&&DATA.voc.words)||[],qs=(DATA.sum&&DATA.sum.qs)||[];
  var vq=[];
  if(words.length>=4){
    shuffle(words).slice(0,8).forEach(function(w){
      var toHe=Math.random()<.5,ans=toHe?w.he:w.src,q=toHe?w.src:w.he;
      var pool=shuffle(words.filter(function(x){return x.id!==w.id&&(toHe?x.he:x.src)!==ans})).map(function(x){return toHe?x.he:x.src});
      var seen={},opts=[];pool.forEach(function(t){if(!seen[t]&&opts.length<3){seen[t]=1;opts.push(t)}});
      if(opts.length<3)return;
      opts.push(ans);opts=shuffle(opts);
      vq.push({src:'מילים',q:(toHe?'מה התרגום של ':'איך אומרים ')+'"'+q+'"'+(toHe?' לעברית?':' בשפה הלועזית?'),opts:opts,ans:opts.indexOf(ans),dir:'auto'});
    });
  }
  var mq=shuffle(qs).slice(0,8).map(function(q){var idx=q.opts.map(function(o,i){return i}),sh=shuffle(idx);return{src:'חומר לימוד',q:q.q,opts:sh.map(function(i){return q.opts[i]}),ans:sh.indexOf(q.ans),dir:'auto'}});
  var a=vq.slice(),b=mq.slice();
  while(out.length<5&&(a.length||b.length)){ if(a.length&&(out.length%2===0||!b.length))out.push(a.shift()); else if(b.length)out.push(b.shift()); }
  return out;
}
function startChallenge(){
  loadData().then(function(){
    var qs=buildQuestions();
    if(qs.length<3){
      openSheet('<h2>אין מספיק חומר</h2><p class="muted">כדי לשחק צריך לפחות 4 מילים במילון, או 3 שאלות במסלול. הוסף עוד קצת ונתחיל!</p><div class="btns"><button class="btn primary" data-go2="vocab:tr">להוסיף מילים</button><button class="btn" data-go2="maslul:prac">לשאלות במסלול</button></div>');
      $$('#panel [data-go2]').forEach(function(b){b.addEventListener('click',function(){var p=b.dataset.go2.split(':');closeSheet();go(p[0],p[1])})});
      return;
    }
    CH={qs:qs,i:0,ok:0,res:[],sel:null,first:daily().d!==ymd()};
    $('#full').hidden=false;drawChallenge();
  });
}
function drawChallenge(){
  var c=CH,q=c.qs[c.i],L=['א','ב','ג','ד'];
  var prog='<div class="prog">'+c.qs.map(function(_,i){return '<i class="'+(c.res[i]===1?'ok':c.res[i]===0?'no':i===c.i?'on':'')+'"></i>'}).join('')+'</div>';
  var top='<div class="row between"><button class="btn" data-ch="quit">יציאה</button><span class="src">'+esc(q.src)+' · '+(c.i+1)+'/'+c.qs.length+'</span></div>';
  var opts=q.opts.map(function(o,i){
    var cls='opt';if(c.sel!=null){if(i===q.ans)cls+=' ok';else if(i===c.sel)cls+=' no'}
    return '<button class="'+cls+'" data-opt="'+i+'" '+(c.sel!=null?'disabled':'')+'><span class="k">'+L[i]+'</span><span dir="auto">'+esc(o)+'</span></button>';
  }).join('');
  var fb='';
  if(c.sel!=null){fb='<div class="card" style="padding:12px 14px">'+(c.sel===q.ans?'נכון!':'התשובה הנכונה: <b dir="auto">'+esc(q.opts[q.ans])+'</b>')+'</div><button class="btn primary block" data-ch="next">'+(c.i+1>=c.qs.length?'לסיכום':'לשאלה הבאה')+'</button>'}
  $('#fullin').innerHTML=top+prog+'<div class="qt" dir="auto">'+esc(q.q)+'</div><div class="stack">'+opts+'</div>'+fb;
}
$('#fullin').addEventListener('click',function(e){
  var o=e.target.closest('[data-opt]'),b=e.target.closest('[data-ch]');
  if(o&&CH&&CH.sel==null){var i=+o.dataset.opt,q=CH.qs[CH.i];CH.sel=i;var ok=i===q.ans;CH.res[CH.i]=ok?1:0;if(ok)CH.ok++;drawChallenge();return}

      '<label class="small muted" for="restoreTxt">שחזור: הדבק טקסט גיבוי</label><textarea id="restoreTxt" dir="ltr" placeholder="הדבק כאן"></textarea>'+
      '<div class="btns"><button class="btn primary" data-s="restoreTxt">שחזר מהטקסט</button><label class="btn" style="cursor:pointer">שחזר מקובץ<input id="restoreFile" type="file" accept=".json,application/json" hidden></label></div></div>'+
    '<div class="card stack"><b>מה עובד בלי אינטרנט</b><p class="muted small" style="margin:0">הכול עובד בלי רשת, חוץ מתרגום אוטומטי של מילים (צריך אינטרנט) ויצירה אוטומטית של שאלות וחידונים עם Claude, שזמינה רק כשהדף נפתח בתוך claude.ai.</p></div>'+
    '<div class="card stack"><b>איפוס</b><button class="btn danger" data-s="wipe">מחק את כל הנתונים</button></div>'+
    '<button class="btn block" data-s="close">סגור</button></div>');
});
$('#panel').addEventListener('click',function(e){
  var b=e.target.closest('[data-s]');if(!b)return;var a=b.dataset.s;
  if(a==='close')closeSheet();
  else if(a==='install')doInstall();
  else if(a==='export')collect().then(function(j){if(window.AndroidBridge&&window.AndroidBridge.shareText){window.AndroidBridge.shareText('maslul-backup-'+ymd()+'.json',JSON.stringify(j));return}var blob=new Blob([JSON.stringify(j)],{type:'application/json'}),u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download='maslul-backup-'+ymd()+'.json';document.body.appendChild(l);l.click();setTimeout(function(){URL.revokeObjectURL(u);l.remove()},3000);toast('הגיבוי ירד')});
  else if(a==='copy')collect().then(function(j){var t=JSON.stringify(j);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast('הגיבוי הועתק')},function(){var ta=$('#restoreTxt');ta.value=t;ta.select();toast('סמן והעתק ידנית')})});
  else if(a==='restoreTxt')restore($('#restoreTxt').value);
  else if(a==='wipe'){if(confirm('למחוק את כל הנתונים של האפליקציה מהמכשיר הזה? אי אפשר לבטל.'))wipeAll()}
});
document.addEventListener('change',function(e){
  if(e.target&&e.target.id==='restoreFile'&&e.target.files[0]){var r=new FileReader();r.onload=function(){restore(String(r.result))};r.readAsText(e.target.files[0])}
});
function collect(){
  return Promise.all([ask('maslul',{t:'dump'}),ask('vocab',{t:'dump'})]).then(function(r){
    return{kind:'maslul-backup',v:1,at:new Date().toISOString(),maslul:r[0]&&r[0].data||null,vocab:r[1]&&r[1].data||null,daily:lsGet('school.daily')};
  });
}
function restore(text){
  var j;try{j=JSON.parse(String(text).trim())}catch(e){toast('הטקסט לא נראה כמו גיבוי');return}
  var m=null,v=null,d=null;
  if(j&&j.kind==='maslul-backup'){m=j.maslul;v=j.vocab;d=j.daily}
  else if(j&&Array.isArray(j.subjects))m=JSON.stringify(j);
  else if(j&&j.words&&j.folders)v=JSON.stringify(j);
  else{toast('לא זיהיתי את סוג הגיבוי');return}
  if(!m&&!v){toast('בגיבוי אין נתונים');return}
  if(!confirm('לשחזר? הנתונים הקיימים של החלקים שבגיבוי יוחלפו.'))return;
  var jobs=[];
  if(m){ready.maslul=false;jobs.push(ask('maslul',{t:'restore',data:m}))}
  if(v){ready.vocab=false;jobs.push(ask('vocab',{t:'restore',data:v}))}
  if(d)lsSet('school.daily',d);
  Promise.all(jobs).then(function(){closeSheet();toast('שוחזר בהצלחה');setTimeout(function(){go(VIEW)},700)});
}
function wipeAll(){
  ready.maslul=false;ready.vocab=false;
  Promise.all([ask('maslul',{t:'wipe'}),ask('vocab',{t:'wipe'})]).then(function(){lsDel('school.daily');lsDel('school.view');closeSheet();toast('הכול נמחק');setTimeout(function(){go('home')},700)});
}

/* ---------- התחלה ---------- */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
go('home');
// קיצורי דרך מהאייקון (לחיצה ארוכה): index.html?go=challenge או go=maslul:time
(function(){
  var q=''; try{q=new URLSearchParams(location.search).get('go')||''}catch(e){}
  if(!q)return;
  if(q==='challenge'){Promise.all([waitReady('maslul'),waitReady('vocab')]).then(startChallenge)}
  else{var p=q.split(':');if(p[0]==='maslul'||p[0]==='vocab'||p[0]==='report')go(p[0],p[1])}
})();
})();
</script>
